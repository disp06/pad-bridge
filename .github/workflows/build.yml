name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server unit tests
        working-directory: server
        run: python -m unittest test_server -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pad-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Also publish the APK on an orphan `apk` branch so it can be fetched with plain git.
      - name: Publish APK to apk branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir /tmp/apkbranch && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkbranch/pad-bridge-debug.apk
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pad-bridge-debug.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
