plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.padbridge.wear'
    compileSdk 34

    defaultConfig {
        applicationId 'com.padbridge.wear'
        // TicWatch Pro 3 GPS on Wear OS 2.x = Android 9 (API 28).
        minSdk 28
        // Deliberately 28: keeps the API-28 permission model (no BLUETOOTH_CONNECT/SCAN,
        // no foregroundServiceType) and keeps the hidden Bluetooth APIs we call by reflection
        // (HID host connect, L2CAP sockets) reachable. Sideload only, not for Play.
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideload convenience: sign release with the debug key. Replace for real distribution.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'MissingPermission', 'DiscouragedPrivateApi', 'PrivateApi', 'SoonBlockedPrivateApi'
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // BoxInsetLayout, WearableRecyclerView, WearableLinearLayoutManager (classic View-based Wear UI).
    implementation 'androidx.wear:wear:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}
